
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DiogoHerrera15
          outputs: |
            dist/github-snake.svg?color_snake=%230284C7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%23161b22,%230c4a6e,%230369a1,%230284c7,%2338bdf8

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
